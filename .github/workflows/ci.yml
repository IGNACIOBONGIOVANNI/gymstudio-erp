name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (build y tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compilar
        run: dotnet build backend/EstudioContable.slnx

      # Unitarios: reglas del dominio, sin base de datos.
      - name: Tests de dominio
        run: dotnet test backend/tests/EstudioContable.Domain.Tests --no-build

      # Integración: API completa contra un PostgreSQL real (Testcontainers usa el
      # Docker que ya trae el runner de GitHub).
      - name: Tests de integración
        run: dotnet test backend/tests/EstudioContable.IntegrationTests --no-build

  frontend:
    name: Frontend (tipos y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
