services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: estudio_contable
    ports:
      - "127.0.0.1:5433:5432" # 5433 para no chocar con un PostgreSQL local; solo accesible desde esta PC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estudio_contable"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5122:5122" # solo accesible desde esta PC
    environment:
      # Connection string uses the 'db' service hostname
      - ConnectionStrings__DefaultConnection=Host=db;Database=estudio_contable;Username=postgres;Password=password
      - DOTNET_USE_POLLING_FILE_WATCHER=1 # Important for hot-reload on Windows hosts via Docker
      - ASPNETCORE_ENVIRONMENT=Development
      # Las copias automáticas se guardan en la carpeta backups de la PC (no dentro del contenedor, que se pierde al recrearlo)
      - Copias__Carpeta=/backups/automaticas
    volumes:
      - ./backend:/app # Bind mount to allow hot reload of code
      - ./backups:/backups # Copias de seguridad: las de los scripts y las automáticas (backups/automaticas)
      # Map nuget packages to avoid downloading every time
      - nuget_packages:/root/.nuget/packages 
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173" # solo accesible desde esta PC
    volumes:
      - ./frontend:/app # Bind mount to allow hot reload
      - /app/node_modules # Exclude node_modules from host to prevent OS incompatibility
    environment:
      - VITE_PROXY_TARGET=http://backend:5122 # el proxy de Vite apunta al contenedor del backend
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  nuget_packages:
